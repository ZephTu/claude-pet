<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="pet.css">
<div id="stage">
  <div id="bubble" hidden></div>
  <!-- #pet is the 120x120 slot. `data-mood` / `data-flash` / `data-phase` live
       on it for the bubble and the calm switch; the cat itself is told its pose
       from Swift (window.setCatLook). -->
  <div id="pet">
  <!-- The cat: video frames drawn with WebGL. The count and the waiting glyph
       are drawn HERE, by the host, because the artwork has neither. -->
  <canvas id="cat" width="240" height="240" aria-hidden="true"></canvas>
  <!-- What shows instead when WebGL is unavailable or a texture will not
       decode: the pose's still picture, swapped by src. Nothing to fail. -->
  <img id="still" alt="" hidden>
  <div id="signals" aria-hidden="true">
    <span id="count" hidden>0</span>
    <!-- The glyph that used to be painted into the waiting texture. Drawn here
         so one "raised paw" picture can mean both "answer me" and "decide
         this" — which it could not while the artwork held a question mark. -->
    <span id="mark" data-mark="none"></span>
  </div>
  </div>
  <div id="panel" hidden></div>
</div>
<!-- The warped-stills renderer, used while frames.js has no clips. -->
<script src="skins/cat/cat-pet.js"></script>
<!-- The frame-by-frame cat. frames.js is its clip list, generated from the
     videos by scripts/cat-frames.swift; while it says null the page stays on
     CatPet. -->
<script src="skins/cat/cat-frames.js"></script>
<script src="skins/cat/frames/frames.js"></script>
<script src="pet.js"></script>
