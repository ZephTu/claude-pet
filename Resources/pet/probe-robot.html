<!doctype html><meta charset="utf-8">
<!-- Spike companion: the SAME measurement against the existing robot, driven
     into its busiest state. Comparing a WebGL cat that is animating against an
     SVG robot that is asleep would flatter the robot by a factor nobody could
     name. Delete with SkinProbe. -->
<style>html,body{margin:0;height:100%;background:#cfcac2}iframe{width:480px;height:280px;border:0}</style>
<iframe id="f" src="index.html"></iframe>
<script>
window.__probe = { skin: "robot" };
document.getElementById("f").addEventListener("load", function () {
  const w = this.contentWindow;
  w.setMood("busy", null, "", "writing");
  w.setBadge("2");
  window.__probe.ready = true;
});
</script>
