<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<header id="top">
  <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 2l4 4h6l4-4v9a7 7 0 0 1-14 0z"/></svg>HQ</div>
  <nav class="tabs mode" id="mode"></nav>
  <label class="capture" title="Jot down a line, a link or a pasted screenshot; Enter files it (new task, a todo, a log line, an update to a task, or your todo). Where it went shows in Needs you."><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l1-3.5L11 2.5a1.4 1.4 0 0 1 2 2L6 11.5z"/></svg><input id="capture" data-att="capture" type="text" placeholder="Quick note…  (Enter)" autocomplete="off"><span id="capture-atts"></span></label>
  <div class="spacer"></div>
  <label class="searchbox"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input id="search" type="search" placeholder="Filter tasks" title="Filters every page: tasks by id, title, refs or project; asks and todos by their own text too. On Projects &amp; duties the matching tasks, closed ones included, are listed at the top" autocomplete="off"></label>
  <button id="secretary-btn" class="btn" data-action="open-secretary" title="Secretary: ask how your tasks are doing and what is waiting on you; its proposals appear in Needs you">Secretary</button>
  <button id="new-task" class="btn primary">＋ New</button>
  <button class="icon top-icon" data-action="open-settings" title="Settings: how sessions start"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  <a id="guide" class="icon top-icon" href="guide.html" title="Guide: how to use HQ"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4M8 11.6v.1"/></svg></a>
</header>
<div id="error" hidden></div>
<main id="today" class="kanban" hidden>
  <section id="today-focus"></section>
</main>
<main id="projects" class="kanban" hidden>
  <section id="proj-view"></section>
</main>
<main id="needs" class="kanban" hidden>
  <div class="vhead"><h1>Needs you</h1></div>
  <div class="needs-sum" id="needs-sum"></div>
  <div class="ncols">
    <section class="lane l-you"><div class="lane-h" id="asks-h"></div><div class="lane-body" id="asks"></div></section>
    <section class="lane l-ready"><div class="lane-h" id="mytodos-h"></div><div class="lane-body" id="mytodos"></div></section>
    <section class="lane l-run"><div class="lane-h" id="notes-h"></div><div class="lane-body" id="notes"></div></section>
  </div>
</main>
<main id="jobs" hidden>
  <section class="col jobs-col">
    <div id="jobs-top"></div>
    <div id="job-form" hidden></div>
    <div id="jobs-list"></div>
  </section>
</main>
<footer id="statusbar"><div id="counts"></div><div class="spacer"></div><div id="quota"></div></footer>
<aside id="drawer" hidden></aside>
<aside id="reader" hidden></aside>
<button id="reader-pill" data-action="rd-expand" hidden></button>
<div id="settings" hidden></div>
<div id="modal" hidden></div>
<div id="confirm" hidden></div>
<div id="toast" hidden></div>
<script src="vendor/markdown-it.min.js"></script>
<script src="board.js"></script>
<script src="jobs.js"></script>
<script src="projects.js"></script>
<script src="reader.js"></script>
</body>
</html>
