<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<header id="top">
  <div class="brand">HQ</div>
  <span class="seg mode" id="mode"></span>
  <div id="counts"></div>
  <div id="quota"></div>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="Filter tasks…" autocomplete="off">
  <button class="btn ghost" data-action="open-projects" title="Projects: names, directories, auto-assign">Projects</button>
  <button class="btn ghost" data-action="open-cats" title="Add, rename or remove categories">Categories</button>
  <button id="new-task" class="btn">+ New task</button>
  <button id="refresh" class="btn ghost" title="Refresh">↻</button>
  <a id="guide" class="btn ghost" href="guide.html" title="How to use HQ">Guide</a>
</header>
<div id="error" hidden></div>
<main id="today" hidden>
  <section class="col" id="today-focus"></section>
  <section class="col" id="today-sessions"></section>
</main>
<main id="all" hidden>
  <section class="col" id="col-tasks">
    <h2>Tasks <span class="seg" id="groupby"></span><label class="toggle af" id="activefirst" title="Projects with a live session come first, most recent activity first"><input type="checkbox" id="activefirst-cb"> active first</label><button class="btn small ghost foldall" id="foldall" data-action="fold-all"></button><label class="toggle"><input type="checkbox" id="show-closed"> show closed</label></h2>
    <div id="projects-panel" hidden></div>
    <div id="cats-panel" hidden></div>
    <div id="newtask-form" hidden></div>
    <div id="tasks"></div>
  </section>
  <section class="col" id="col-sessions">
    <h2>Sessions <span class="seg" id="sgroupby"></span></h2>
    <div id="sessions"></div>
  </section>
</main>
<main id="needs" hidden>
  <section class="col" id="col-asks"><div id="asks"></div></section>
  <section class="col" id="col-mytodos"><div id="mytodos"></div></section>
</main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="board.js"></script>
</body>
</html>
