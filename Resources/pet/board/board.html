<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<header id="top">
  <div class="brand">HQ</div>
  <div id="counts"></div>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="Filter tasks…" autocomplete="off">
  <button class="btn ghost" data-action="open-projects" title="Projects: names, directories, auto-assign">Projects</button>
  <button class="btn ghost" data-action="open-cats" title="Add, rename or remove categories">Categories</button>
  <button id="new-task" class="btn">+ New task</button>
  <button id="refresh" class="btn ghost" title="Refresh">↻</button>
  <a id="guide" class="btn ghost" href="guide.html" title="How to use HQ">Guide</a>
</header>
<div id="error" hidden></div>
<main>
  <section class="col" id="col-you">
    <h2>Needs you</h2>
    <div id="asks"></div>
    <div id="mytodos"></div>
    <div id="waiting"></div>
  </section>
  <section class="col" id="col-tasks">
    <h2>Tasks <span class="seg" id="groupby"></span><label class="toggle"><input type="checkbox" id="show-closed"> show closed</label></h2>
    <div id="projects-panel" hidden></div>
    <div id="cats-panel" hidden></div>
    <div id="newtask-form" hidden></div>
    <div id="tasks"></div>
  </section>
  <section class="col" id="col-sessions">
    <h2>Sessions</h2>
    <div id="sessions"></div>
  </section>
</main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="board.js"></script>
</body>
</html>
