<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<header id="top">
  <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 2l4 4h6l4-4v9a7 7 0 0 1-14 0z"/></svg>HQ</div>
  <nav class="tabs mode" id="mode"></nav>
  <div class="spacer"></div>
  <label class="searchbox"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input id="search" type="search" placeholder="Filter tasks" autocomplete="off"></label>
  <button id="new-task" class="btn primary">New task</button>
  <button class="icon top-icon" data-action="open-settings" title="Settings: projects, categories, how sessions start"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  <a id="guide" class="icon top-icon" href="guide.html" title="Guide: how to use HQ"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4M8 11.6v.1"/></svg></a>
</header>
<div id="error" hidden></div>
<main id="today" hidden>
  <section class="col" id="today-focus"></section>
  <section class="col side" id="today-sessions"></section>
</main>
<main id="all" hidden>
  <section class="col" id="col-tasks">
    <div class="vhead"><h1>All tasks</h1><span class="spacer"></span><span class="seg" id="groupby"></span><label class="toggle af" id="activefirst" title="Projects with a live session come first, most recent activity first"><input type="checkbox" id="activefirst-cb"> active first</label><button class="btn small ghost foldall" id="foldall" data-action="fold-all"></button><label class="toggle"><input type="checkbox" id="show-closed"> show closed</label></div>
    <div id="newtask-form" hidden></div>
    <div id="tasks"></div>
  </section>
  <section class="col side" id="col-sessions">
    <div class="vhead"><h2 class="side-h">Sessions</h2><span class="spacer"></span><span class="seg" id="sgroupby"></span></div>
    <div id="sessions"></div>
  </section>
</main>
<main id="needs" class="single" hidden>
  <section class="col inbox"><div id="asks"></div><div id="mytodos"></div></section>
</main>
<main id="jobs" hidden>
  <section class="col jobs-col">
    <div id="jobs-top"></div>
    <div id="job-form" hidden></div>
    <div id="jobs-list"></div>
  </section>
</main>
<footer id="statusbar"><div id="counts"></div><div class="spacer"></div><div id="quota"></div></footer>
<div id="settings" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="board.js"></script>
<script src="jobs.js"></script>
</body>
</html>
