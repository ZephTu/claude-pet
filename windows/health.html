<!doctype html>
<!-- The connection report (tray → Connection Status…): the Mac's HealthWindow, drawn from
     `pet-emit --health`. main.js shows it in a small frameless window beside the pet and calls
     window.showHealth(doc); health-preload.js gives it copy / close / fit. Always dark, as the
     Mac's: it belongs to a pet whose panel is charcoal. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Connection Status</title>
<style>
  :root {
    --glass: rgba(27, 31, 39, 0.96);
    --text: #e8ebf1;
    --dim: #a4abba;
    --fainter: #6e7688;
    --ring: rgba(255, 255, 255, 0.10);
    --ctl: rgba(255, 255, 255, 0.07);
    --ctl-hover: rgba(255, 255, 255, 0.12);
    --ctl-edge: rgba(255, 255, 255, 0.16);
    --tabby: #f2a541;
    --coral: #ef6f5a;
    --sage: #7cc4a4;
    --sans: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  html, body { margin: 0; background: transparent; }
  body { font: 12px/1.4 var(--sans); color: var(--text); user-select: none; -webkit-user-select: none; }
  #panel {
    box-sizing: border-box; width: 360px; padding: 16px 16px 14px;
    border-radius: 12px; border: 1px solid var(--ring); background: var(--glass);
    -webkit-app-region: drag;   /* moved by its background, as the Mac's */
  }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  .row { margin: 0 0 9px; }
  .head { display: flex; align-items: baseline; gap: 6px; }
  .glyph { width: 11px; font-size: 10px; text-align: center; flex: none; }
  .name { font-weight: 600; }
  .label { font-size: 11px; }
  .detail { margin: 1px 0 0 17px; font-size: 11px; color: var(--dim); overflow-wrap: anywhere;
            user-select: text; -webkit-user-select: text; -webkit-app-region: no-drag; }
  [data-status="ok"] .glyph, [data-status="ok"] .label { color: var(--sage); }
  [data-status="needsAttention"] .glyph, [data-status="needsAttention"] .label { color: var(--coral); }
  [data-status="unknown"] .glyph, [data-status="unknown"] .label { color: var(--tabby); }
  [data-status="notConfigured"] .glyph, [data-status="notConfigured"] .label,
  [data-status="unsupported"] .glyph, [data-status="unsupported"] .label { color: var(--fainter); }
  #loading { color: var(--dim); font-size: 11px; margin: 0 0 9px; }
  .buttons { display: flex; justify-content: flex-end; gap: 8px; padding-top: 6px; }
  button {
    -webkit-app-region: no-drag; font: inherit; font-size: 12px; color: var(--text);
    background: var(--ctl); border: 1px solid var(--ctl-edge); border-radius: 6px; padding: 3px 14px;
  }
  button:hover { background: var(--ctl-hover); }
  button:disabled { opacity: 0.45; }
</style>
</head>
<body>
<div id="panel">
  <h1 id="title"></h1>
  <div id="rows"><div id="loading"></div></div>
  <div class="buttons">
    <button id="copy" disabled></button>
    <button id="close"></button>
  </div>
</div>
<script>
  const zh = (window.health && window.health.lang === "zh") || /[?&]lang=zh/.test(location.search);
  const T = (en, z) => (zh ? z : en);
  // The status's shape as well as its colour, so it never rests on colour vision alone.
  const GLYPH = { ok: "●", needsAttention: "▲", notConfigured: "○", unsupported: "—", unknown: "?" };
  let summary = "";
  document.getElementById("title").textContent = T("Connection status", "连接状态");
  document.getElementById("loading").textContent = T("Checking…", "正在检查…");
  document.getElementById("copy").textContent = T("Copy", "复制");
  document.getElementById("close").textContent = T("Close", "关闭");

  function fit() { if (window.health) window.health.fit(document.getElementById("panel").offsetHeight); }

  /** pet-emit --health's document: { checks: [{key, name, status, label, detail}], summary }. */
  window.showHealth = (doc) => {
    const rows = document.getElementById("rows");
    rows.textContent = "";
    for (const c of (doc && doc.checks) || []) {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.status = c.status;
      row.dataset.key = c.key;
      const head = document.createElement("div");
      head.className = "head";
      for (const [cls, text] of [["glyph", GLYPH[c.status] || "?"], ["name", c.name], ["label", c.label]]) {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = text;
        head.append(span);
      }
      const detail = document.createElement("div");
      detail.className = "detail";
      detail.textContent = c.detail;
      row.append(head, detail);
      rows.append(row);
    }
    if (!rows.childElementCount) {
      const none = document.createElement("div");
      none.id = "loading";
      none.textContent = T("The checks could not run — see the log.", "检查没能运行 — 请看日志。");
      rows.append(none);
    }
    summary = (doc && doc.summary) || "";
    document.getElementById("copy").disabled = !summary;
    fit();
  };

  document.getElementById("copy").addEventListener("click", () => {
    if (window.health && summary) window.health.copy();
    if (window.health) window.health.close();
  });
  document.getElementById("close").addEventListener("click", () => window.health && window.health.close());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && window.health) window.health.close(); });
  fit();
</script>
</body>
</html>
